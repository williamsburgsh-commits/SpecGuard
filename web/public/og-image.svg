<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#080a12"/>
      <stop offset="50%" style="stop-color:#0d0f1a"/>
      <stop offset="100%" style="stop-color:#080a12"/>
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="50%" style="stop-color:#38e8ff"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Subtle grid pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(56,232,255,0.03)" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>
  
  <!-- Radial glow -->
  <ellipse cx="200" cy="100" rx="300" ry="200" fill="rgba(56,232,255,0.08)" filter="url(#blur)"/>
  <ellipse cx="1000" cy="530" rx="400" ry="300" fill="rgba(167,139,250,0.06)" filter="url(#blur)"/>
  <defs>
    <filter id="blur"><feGaussianBlur stdDeviation="80"/></filter>
  </defs>

  <!-- Content -->
  <text x="600" y="240" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="64" font-weight="700" fill="url(#textGradient)" letter-spacing="-2">
    SpecGuard
  </text>
  <text x="600" y="310" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="28" font-weight="400" fill="#38e8ff" font-style="italic" letter-spacing="-0.5">
    Policy onchain. Proof in public.
  </text>
  <text x="600" y="380" text-anchor="middle" font-family="Inter, sans-serif" font-size="18" fill="#888" font-weight="400">
    Onchain policy memos · Public GREEN/RED status · Phoenix Perps
  </text>
  
  <!-- Pixel badges -->
  <g transform="translate(450, 450)">
    <rect x="0" y="0" width="140" height="40" rx="8" fill="rgba(74,222,128,0.15)" stroke="#4ade80" stroke-width="2"/>
    <text x="70" y="27" text-anchor="middle" font-family="Pixelify Sans, sans-serif" font-size="14" font-weight="600" fill="#4ade80">GREEN</text>
  </g>
  <g transform="translate(610, 450)">
    <rect x="0" y="0" width="120" height="40" rx="8" fill="rgba(248,113,113,0.15)" stroke="#f87171" stroke-width="2"/>
    <text x="60" y="27" text-anchor="middle" font-family="Pixelify Sans, sans-serif" font-size="14" font-weight="600" fill="#f87171">RED</text>
  </g>
</svg>